name: Deploy dev

# develop -> stack serverless-todo-dev (Stage=dev, Amplify branch develop).
# Runs on every push/merge to develop, or manually from the Actions tab.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# One dev deploy at a time; a newer push waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Manual runs must target develop too, so dev always matches that branch.
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: dev
      branch: develop
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
