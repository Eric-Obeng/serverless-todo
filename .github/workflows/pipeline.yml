name: SAM pipeline

# Branch flow: feature/* -> PR -> develop -> PR -> main (protected).
# Every push/PR to develop or main runs the `test` job (use it as the required
# status check). Merges deploy:
#   develop -> stack serverless-todo-dev  (Stage=dev,  Amplify branch develop)
#   main    -> stack serverless-todo-prod (Stage=prod, Amplify branch main)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Frontend build check
        working-directory: frontend
        env:
          VITE_AWS_REGION: eu-central-1
          VITE_USER_POOL_ID: ci
          VITE_USER_POOL_CLIENT_ID: ci
          VITE_API_URL: https://example.com
        run: |
          npm ci
          npm run build
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate template
        run: sam validate --lint

  deploy:
    needs: test
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # GitHub environment per stage: add protection rules / env-specific vars there.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      STACK_NAME: serverless-todo-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      BRANCH: ${{ github.ref_name }}
    permissions:
      id-token: write # GitHub OIDC -> AWS IAM role (see infra/bootstrap.yaml)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend deps (esbuild)
        working-directory: backend
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"   # sam build needs esbuild on PATH

      - name: sam build
        run: sam build

      - name: sam deploy
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          PARAMS=(
            "Stage=$STAGE"
            "FrontendRepositoryUrl=${{ github.server_url }}/${{ github.repository }}"
            "FrontendBranch=$BRANCH"
          )
          # SAM rejects empty values ("AlarmEmail="), so only pass it when set.
          if [ -n "$ALARM_EMAIL" ]; then PARAMS+=("AlarmEmail=$ALARM_EMAIL"); fi

          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-prefix "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}"

      - name: Build frontend on Amplify (after backend, with its env vars)
        run: |
          APP_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AmplifyAppId'].OutputValue" --output text)
          if [ -n "$APP_ID" ] && [ "$APP_ID" != "None" ]; then
            aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE
          fi

      - name: Stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" --output table
