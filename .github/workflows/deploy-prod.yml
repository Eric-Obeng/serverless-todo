name: Deploy prod

# main -> stack serverless-todo-prod (Stage=prod, Amplify branch main).
# Runs on every push/merge to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One prod deploy at a time; a newer push waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Manual runs must target main too, so prod always matches that branch.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: prod
      branch: main
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
