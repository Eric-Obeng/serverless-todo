AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: IAM role GitHub Actions assumes via OIDC to deploy the SAM stack.
  aws cloudformation deploy --template-file infra/github-oidc-role.yaml \
    --stack-name serverless-todo-github-oidc --capabilities CAPABILITY_NAMED_IAM \
    --parameter-overrides GitHubOrg=<owner> GitHubRepo=<repo>

Parameters:
  GitHubOrg:
    Type: String
  GitHubRepo:
    Type: String
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to "false" if token.actions.githubusercontent.com already exists in the account.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: serverless-todo-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      # Lab convenience. Tighten to the services in template.yaml for production.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Description: Save as the AWS_DEPLOY_ROLE_ARN GitHub secret
    Value: !GetAtt DeployRole.Arn
